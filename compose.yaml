services:
  rentFlow.api:
    image: ${DOCKER_REGISTRY-}rentflowapi
    container_name: RentFlow.Api
    build:
      context: .
      dockerfile: src/API/Rentflow.Api/Dockerfile
    depends_on:
      rentFlow.database:
        condition: service_healthy
    ports:
      - 5000:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

  rentFlow.database:
    image: postgres:18
    container_name: RentFlow.Database
    environment:
      - POSTGRES_DB=rentFlow
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/db:/var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rentFlow"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  rentFlow.seq:
    image: datalust/seq:latest
    container_name: RentFlow.Seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - 5341:5341
      - 8081:80
    volumes:
      - ./.containers/seq:/data
